<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBTC × ISS Demo Login</title>
<style>body{font:16px system-ui;background:#101827;color:#eef4ff;display:grid;place-items:center;min-height:100vh}main{background:#1b2940;padding:28px;border-radius:16px;width:min(420px,88vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border-radius:8px}button{background:#8ed8ff;font-weight:bold}small,p{color:#c1cede}</style>
<main><h1>NBTC × ISS</h1><p>Educational dashboard · Demo login</p><form method="post"><label>Project access code</label><input name="login_code" type="password" required autocomplete="current-password"><button>Sign in</button></form>
{% for m in get_flashed_messages() %}<p role="alert">{{m}}</p>{% endfor %}<p><b>Privacy:</b> Use a separate random demo code. Never use a Thai national ID or personal account password.</p><small>Not an official NBTC login; no connection to NBTC systems.</small></main></html>
